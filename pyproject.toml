[build-system]
requires = []
build-backend = "setuptools.build_meta"
backend-path = []

[project]
name = "mal-openings"
version = "0.1.0"
description = "Build a Spotify playlist of opening themes for every show on a MyAnimeList user's list. Zero dependencies, stdlib only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mal-openings contributors" }]
keywords = ["myanimelist", "spotify", "anime", "openings", "playlist", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
mal-openings = "mal_openings.cli:main"

[tool.setuptools]
packages = ["mal_openings"]
